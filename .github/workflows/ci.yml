name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Vet & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Run Tests
        shell: bash
        run: |
          set -o pipefail
          go test -v -count=1 ./... 2>&1 | tee test-output.txt

      - name: Build binary
        run: go build -ldflags="-s -w" -o /tmp/wame-check ./cmd/wame

      - name: Publish Test Summary
        if: always()
        shell: bash
        run: |
          echo "### 🧪 Go Test Summary (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "--- (PASS|FAIL):|ok\s+wame|FAIL\s+wame" test-output.txt | tail -n 25 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
